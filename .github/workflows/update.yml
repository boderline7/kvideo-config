name: Update sources

on:
  schedule:
    # 每天 UTC 20:10（北京时间 04:10），避开整点高负载
    - cron: '10 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sources
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 全量转换：拉上游 -> 转 KVideo 字段 -> 写 dist/ 和 README，不探测、不筛选
      - name: Build
        run: node scripts/build.mjs

      # 三方汇总：本仓库 + puppet680/KVideo-config + 335459215/kvideo-sources
      # 上游标注失效的不收录，标注有效的收录；按请求地址去重
      - name: Merge
        run: node scripts/merge.mjs

      - name: Verify
        run: node scripts/verify.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist README.md
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 同步上游源 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push

      # jsDelivr 的 @main 会缓存旧内容，推完手动刷一下，免得「加速」地址还发昨天的列表
      - name: Purge CDN cache
        if: success()
        run: |
          for f in kvideo-merged.json kvideo-normal.json kvideo-sources.json; do
            echo "purge $f"
            curl -s -m 40 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/dist/$f" | head -c 200 || true
            echo
          done
