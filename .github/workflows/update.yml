name: Update sources

on:
  schedule:
    # 每天 UTC 20:10（北京时间 04:10），避开整点高负载
    - cron: '10 20 * * *'
  workflow_dispatch:
    inputs:
      include_premium:
        description: '同时输出特殊分组源（默认不输出）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-sources
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 纯转换：拉上游 -> 转 KVideo 字段 -> 写 dist/ 和 README，不探测
      - name: Build
        env:
          INCLUDE_PREMIUM: ${{ inputs.include_premium && '1' || '0' }}
        run: node scripts/build.mjs

      - name: Verify
        run: node scripts/verify.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist README.md
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 同步上游源 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push
